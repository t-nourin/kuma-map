<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クマ目撃情報マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Firebase (compat SDK: 素のscriptタグで使えるバージョン) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #2d6a4f;
    --green-light: #52b788;
    --green-pale: #d8f3dc;
    --brown: #7f4f24;
    --brown-light: #dda15e;
    --cream: #fefae0;
    --gray: #6c757d;
    --shadow: 0 2px 12px rgba(0,0,0,0.12);
  }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: var(--cream);
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--green);
    color: white;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    z-index: 1000;
    gap: 8px;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .badge {
    background: var(--brown-light);
    color: var(--brown);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .admin-btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    border-radius: 999px;
    width: 32px; height: 32px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .admin-btn:hover { background: rgba(255,255,255,0.28); }
  .admin-btn.on { background: var(--brown-light); color: var(--brown); }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #map { flex: 1; z-index: 1; }

  .list-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 999;
    background: white;
    color: var(--green);
    border: 2px solid var(--green-pale);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-family: inherit;
    transition: background 0.15s;
  }
  .list-btn:hover { background: var(--green-pale); }
  .pending-btn { color: #b5651d; border-color: #f3d9b1; display: flex; align-items: center; gap: 6px; }
  .pending-btn:hover { background: #fdf1de; }
  .pending-count-badge {
    background: #e63946; color: white; font-size: 11px; font-weight: 800;
    border-radius: 999px; padding: 1px 7px; min-width: 16px; text-align: center;
  }

  .pending-card {
    background: #fffaf0;
    border: 1.5px solid #f3d9b1;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 12px;
  }
  .pending-source { font-size: 11px; color: var(--gray); margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5d5b8; white-space: pre-wrap; line-height: 1.5; }
  .pending-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-approve, .btn-reject {
    flex: 1; padding: 9px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .btn-approve { background: var(--green); color: white; }
  .btn-approve:hover { opacity: 0.87; }
  .btn-reject { background: #f0f0f0; color: #c1121f; }
  .btn-reject:hover { background: #fde2e2; }

  /* パネル（ボトムシート） */
  .panel-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 2000;
    align-items: flex-end;
    justify-content: center;
  }
  .panel-overlay.open { display: flex; }
  .panel {
    background: white;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 540px;
    padding: 20px 20px 36px;
    max-height: 88vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }

  .panel-handle { width: 40px; height: 4px; background: #ddd; border-radius: 999px; margin: 0 auto 18px; }
  .panel h2 { font-size: 17px; font-weight: 700; color: var(--green); margin-bottom: 18px; }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    margin-top: 16px;
  }
  .form-label:first-child { margin-top: 0; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a1a;
    background: #fafafa;
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus { border-color: var(--green-light); background: white; }

  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-primary { background: var(--green); color: white; }
  .btn-primary:hover { opacity: 0.87; }
  .btn-cancel { background: #f0f0f0; color: var(--gray); }
  .btn-cancel:hover { background: #e5e5e5; }
  .btn-danger { background: #e63946; color: white; }
  .btn-danger:hover { opacity: 0.87; }

  .admin-status-ok {
    background: var(--green-pale); color: var(--green); border: 1.5px solid var(--green-light);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 600; line-height: 1.6;
  }
  .admin-error { color: #c1121f; font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* 一覧カード */
  .sighting-card {
    background: #fafafa;
    border: 1.5px solid #ececec;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .sighting-card:hover { border-color: var(--green-light); background: #f5fdf7; }
  .recent-card { border-color: #f4b8bc; background: #fff6f6; }
  .recent-card:hover { border-color: #e63946; background: #fff0f0; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-place { font-weight: 700; font-size: 14px; color: var(--brown); }
  .card-date { font-size: 12px; color: var(--gray); white-space: nowrap; }
  .card-count { display: inline-block; background: var(--green-pale); color: var(--green); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 5px; }
  .card-note { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.5; }
  .card-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 6px; transition: color 0.15s; }
  .card-delete:hover { color: #e63946; }

  .empty-msg { text-align: center; color: var(--gray); padding: 36px 0; font-size: 14px; line-height: 2; }

  /* ポップアップ */
  .leaflet-popup-content-wrapper { border-radius: 14px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important; }
  .popup-inner { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; min-width: 190px; }
  .popup-title { font-weight: 700; font-size: 15px; color: var(--brown); margin-bottom: 5px; }
  .popup-count { display: inline-block; background: var(--green-pale); color: var(--green); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-bottom: 5px; }
  .popup-meta { font-size: 12px; color: var(--gray); margin-bottom: 5px; }
  .popup-note { font-size: 13px; color: #444; line-height: 1.5; }

  /* 最新の目撃（強調表示） */
  .recent-pin { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .recent-emoji { position: relative; z-index: 2; font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.4)); }
  .recent-pulse {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(230, 57, 70, 0.35);
    animation: pulse-ring 1.6s ease-out infinite;
    z-index: 1;
  }
  @keyframes pulse-ring {
    0%   { transform: scale(0.5); opacity: 0.9; }
    70%  { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .new-badge {
    display: inline-block;
    background: #e63946;
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 999px;
    vertical-align: middle;
    letter-spacing: 0.03em;
  }

  /* トースト */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: white;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🐻クマ目撃情報マップ</h1>
  <div class="header-right">
    <span class="badge" id="total-badge">読み込み中...</span>
    <button class="admin-btn" id="admin-btn" onclick="openAdminPanel()" title="管理者ログイン">🔑</button>
  </div>
</header>

<div class="main">
  <div id="map"></div>
  <button class="list-btn" onclick="openList()">📋 目撃一覧</button>
  <button class="list-btn pending-btn" id="pending-btn" onclick="openPending()" style="display:none;left:auto;right:12px;">⏳ 承認待ち <span id="pending-count" class="pending-count-badge">0</span></button>
</div>

<!-- 一覧パネル -->
<div class="panel-overlay" id="list-panel">
  <div class="panel">
    <div class="panel-handle"></div>
    <h2>📋 目撃一覧</h2>
    <div id="list-content"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-cancel" onclick="closeList()">閉じる</button>
    </div>
  </div>
</div>

<!-- 承認待ちパネル（管理者のみ） -->
<div class="panel-overlay" id="pending-panel">
  <div class="panel">
    <div class="panel-handle"></div>
    <h2>⏳ 承認待ちの目撃情報</h2>
    <p style="font-size:13px;color:var(--gray);margin-bottom:14px;">メールから自動抽出された情報です。内容を確認し、問題なければ「承認して公開」してください。誤りやいたずらの場合は「却下」してください。</p>
    <div id="pending-content"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-cancel" onclick="closePending()">閉じる</button>
    </div>
  </div>
</div>

<!-- 管理者ログインパネル -->
<div class="panel-overlay" id="admin-panel">
  <div class="panel">
    <div class="panel-handle"></div>
    <h2>🔑 管理者ログイン</h2>

    <div id="admin-logged-out">
      <span class="form-label">メールアドレス</span>
      <input type="email" id="admin-email" placeholder="admin@example.com" autocomplete="username">
      <span class="form-label">パスワード</span>
      <input type="password" id="admin-password" placeholder="パスワード" autocomplete="current-password">
      <div class="admin-error" id="admin-error"></div>
      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeAdminPanel()">閉じる</button>
        <button class="btn btn-primary" onclick="adminLogin()">ログイン</button>
      </div>
    </div>

    <div id="admin-logged-in" style="display:none;">
      <div class="admin-status-ok">✅ 管理者としてログイン中です。<br>「📋 目撃一覧」の各項目に削除ボタン（✕）が表示されます。</div>
      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeAdminPanel()">閉じる</button>
        <button class="btn btn-danger" onclick="adminLogout()">ログアウト</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================
//  Firebase 初期化
//  ↓ ここを、自分のFirebaseプロジェクトの設定値に置き換えてください
//  （Firebaseコンソール → プロジェクトの設定 → 全般 → マイアプリ → 「SDK の設定と構成」で確認できます）
// =====================
const firebaseConfig = {
  apiKey: "AIzaSyAVtexsMKLg9e73QuRjhajOy1ngMZBzD_o",
  authDomain: "t-kumamap.firebaseapp.com",
  projectId: "t-kumamap",
  storageBucket: "t-kumamap.firebasestorage.app",
  messagingSenderId: "495747171211",
  appId: "1:495747171211:web:d450372487a623186be58e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const SIGHTINGS_COLLECTION = 'sightings'; // Firestoreのコレクション名

// =====================
//  地図初期化
// =====================
const map = L.map('map').setView([34.4670512, 131.7731237], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

function makeIcon(isRecent) {
  if (isRecent) {
    return L.divIcon({
      html: `<div class="recent-pin">
               <span class="recent-pulse"></span>
               <span class="recent-emoji">🐻</span>
             </div>`,
      iconSize: [44, 44],
      iconAnchor: [22, 22],
      className: ''
    });
  }
  return L.divIcon({
    html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));">🐻</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    className: ''
  });
}

// =====================
//  状態
// =====================
let sightings = [];      // Firestoreから取得した目撃情報（{id, locName, lat, lng, date, count, note}）
let markerMap = {};      // id -> L.marker
let isAdmin = false;      // 管理者としてログイン中か
let pendingSightings = []; // 承認待ちの目撃情報（管理者のみ閲覧可）
let pendingUnsub = null;   // 承認待ちリスナーの解除関数
const PENDING_COLLECTION = 'pending_sightings'; // メールから自動抽出された未承認データの置き場

// =====================
//  Firestore リアルタイム同期
//  他の人が管理者として削除すると、全員の画面に自動で反映されます
// =====================
function listenSightings() {
  db.collection(SIGHTINGS_COLLECTION).onSnapshot(
    (snapshot) => {
      sightings = [];
      snapshot.forEach(doc => {
        sightings.push({ id: doc.id, ...doc.data() });
      });
      sightings.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
      sightings.forEach((s, i) => { s.isRecent = i < 1; });
      Object.values(markerMap).forEach(m => map.removeLayer(m));
      markerMap = {};
      sightings.forEach(s => addMarker(s));
      updateBadge();
      if (document.getElementById('list-panel').classList.contains('open')) {
        renderList();
      }
    },
    (err) => {
      showToast('❌ データの取得に失敗しました: ' + err.message);
    }
  );
}

// =====================
//  マーカー描画
// =====================
function addMarker(s) {
  if (!s.lat || !s.lng) return;
  const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.isRecent) })
    .addTo(map)
    .bindPopup(`
      <div class="popup-inner">
        <div class="popup-title">🐻 ${escHtml(s.locName || '場所名なし')} ${s.isRecent ? '<span class="new-badge">NEW</span>' : ''}</div>
        <div class="popup-count">${escHtml(s.count)}</div>
        <div class="popup-meta">${escHtml(s.date)}</div>
        ${s.note ? `<div class="popup-note">${escHtml(s.note)}</div>` : ''}
      </div>
    `, { maxWidth: 250 });
  markerMap[s.id] = m;
}

function updateBadge() {
  document.getElementById('total-badge').textContent = `目撃 ${sightings.length}件`;
}

// =====================
//  一覧パネル
// =====================
function openList() {
  renderList();
  document.getElementById('list-panel').classList.add('open');
}

function closeList() {
  document.getElementById('list-panel').classList.remove('open');
}

function renderList() {
  const el = document.getElementById('list-content');
  if (sightings.length === 0) {
    el.innerHTML = '<div class="empty-msg">現在、登録されている目撃情報はありません。</div>';
    return;
  }
  el.innerHTML = sightings.map(s => `
    <div class="sighting-card${s.isRecent ? ' recent-card' : ''}" onclick="flyToSighting('${s.id}')">
      <div class="card-head">
        <span class="card-place">🐻 ${escHtml(s.locName)} ${s.isRecent ? '<span class="new-badge">NEW</span>' : ''}</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span class="card-date">${escHtml(s.date)}</span>
          ${isAdmin ? `<button class="card-delete" onclick="deleteSighting(event,'${s.id}')" title="削除">✕</button>` : ''}
        </span>
      </div>
      <span class="card-count">${escHtml(s.count)}</span>
      ${s.note ? `<div class="card-note">${escHtml(s.note)}</div>` : ''}
    </div>
  `).join('');
}

function flyToSighting(id) {
  const s = sightings.find(x => x.id === id);
  if (s && s.lat && s.lng) {
    closeList();
    map.flyTo([s.lat, s.lng], 15, { duration: 1 });
    setTimeout(() => markerMap[id]?.openPopup(), 1200);
  }
}

function deleteSighting(e, id) {
  e.stopPropagation();
  if (!isAdmin) return; // 念のための二重チェック（実際の権限制御はFirestoreのセキュリティルール側で行う）
  if (!confirm('この目撃情報を削除しますか？この操作は元に戻せません。')) return;
  db.collection(SIGHTINGS_COLLECTION).doc(id).delete()
    .then(() => showToast('🗑️ 削除しました'))
    .catch(err => showToast('❌ 削除に失敗しました: ' + err.message));
}

// =====================
//  承認待ち（メールから自動抽出されたもの）
//  管理者としてログインしている間だけFirestoreを購読します
//  （Firestoreのセキュリティルールで pending_sightings の読み取りは認証ユーザーのみに制限）
// =====================
function startPendingListener() {
  if (pendingUnsub) return; // 二重購読を防ぐ
  pendingUnsub = db.collection(PENDING_COLLECTION).onSnapshot(
    (snapshot) => {
      pendingSightings = [];
      snapshot.forEach(doc => pendingSightings.push({ id: doc.id, ...doc.data() }));
      pendingSightings.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
      updatePendingBadge();
      if (document.getElementById('pending-panel').classList.contains('open')) {
        renderPending();
      }
    },
    (err) => showToast('❌ 承認待ちデータの取得に失敗しました: ' + err.message)
  );
}

function stopPendingListener() {
  if (pendingUnsub) { pendingUnsub(); pendingUnsub = null; }
  pendingSightings = [];
  updatePendingBadge();
}

function updatePendingBadge() {
  const btn = document.getElementById('pending-btn');
  const countEl = document.getElementById('pending-count');
  if (!isAdmin) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  countEl.textContent = pendingSightings.length;
}

function openPending() {
  renderPending();
  document.getElementById('pending-panel').classList.add('open');
}
function closePending() {
  document.getElementById('pending-panel').classList.remove('open');
}

function renderPending() {
  const el = document.getElementById('pending-content');
  if (pendingSightings.length === 0) {
    el.innerHTML = '<div class="empty-msg">現在、承認待ちの情報はありません。</div>';
    return;
  }
  el.innerHTML = pendingSightings.map(s => `
    <div class="pending-card">
      <div class="card-head">
        <span class="card-place">🐻 ${escHtml(s.locName || '場所名不明')}</span>
        <span class="card-date">${escHtml(s.date || '日時不明')}</span>
      </div>
      <span class="card-count">${escHtml(s.count || '不明')}</span>
      ${s.note ? `<div class="card-note">${escHtml(s.note)}</div>` : ''}
      ${s.rawEmailText ? `<div class="pending-source">元のメール本文：\n${escHtml(s.rawEmailText)}</div>` : ''}
      <div class="pending-actions">
        <button class="btn-reject" onclick="rejectPending('${s.id}')">✕ 却下</button>
        <button class="btn-approve" onclick="approvePending('${s.id}')">✅ 承認して公開</button>
      </div>
    </div>
  `).join('');
}

function approvePending(id) {
  if (!isAdmin) return;
  const s = pendingSightings.find(x => x.id === id);
  if (!s) return;
  if (!s.lat || !s.lng) {
    showToast('⚠️ 緯度・経度が無いため公開できません。内容を確認してください。');
    return;
  }
  const { id: _drop, rawEmailText, ...publicData } = s;
  db.collection(SIGHTINGS_COLLECTION).add(publicData)
    .then(() => db.collection(PENDING_COLLECTION).doc(id).delete())
    .then(() => showToast('✅ 承認して公開しました'))
    .catch(err => showToast('❌ 処理に失敗しました: ' + err.message));
}

function rejectPending(id) {
  if (!isAdmin) return;
  if (!confirm('この情報を却下しますか？（公開されず、削除されます）')) return;
  db.collection(PENDING_COLLECTION).doc(id).delete()
    .then(() => showToast('🗑️ 却下しました'))
    .catch(err => showToast('❌ 削除に失敗しました: ' + err.message));
}

// =====================
//  管理者ログイン
// =====================
function openAdminPanel() {
  document.getElementById('admin-error').textContent = '';
  document.getElementById('admin-panel').classList.add('open');
}
function closeAdminPanel() {
  document.getElementById('admin-panel').classList.remove('open');
}

function adminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const pw = document.getElementById('admin-password').value;
  const errEl = document.getElementById('admin-error');
  errEl.textContent = '';
  if (!email || !pw) {
    errEl.textContent = 'メールアドレスとパスワードを入力してください。';
    return;
  }
  auth.signInWithEmailAndPassword(email, pw)
    .then(() => {
      document.getElementById('admin-password').value = '';
      closeAdminPanel();
      showToast('✅ 管理者としてログインしました');
    })
    .catch(() => {
      errEl.textContent = 'ログインに失敗しました。メールアドレスまたはパスワードをご確認ください。';
    });
}

function adminLogout() {
  auth.signOut().then(() => showToast('ログアウトしました'));
}

auth.onAuthStateChanged((user) => {
  isAdmin = !!user;
  document.getElementById('admin-logged-out').style.display = isAdmin ? 'none' : '';
  document.getElementById('admin-logged-in').style.display = isAdmin ? '' : 'none';
  document.getElementById('admin-btn').classList.toggle('on', isAdmin);
  document.getElementById('admin-btn').textContent = isAdmin ? '🔓' : '🔑';
  if (document.getElementById('list-panel').classList.contains('open')) {
    renderList();
  }
  if (isAdmin) {
    startPendingListener();
  } else {
    stopPendingListener();
    closePending();
  }
});

// =====================
//  ユーティリティ
// =====================
function escHtml(s) {
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// =====================
//  起動
// =====================
listenSightings();
</script>
